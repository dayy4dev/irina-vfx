<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irina Drawer</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 60px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px; min-height: 260px; padding: 40px 0; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Drawer</h1>
  <p class="sub">A slide-over sheet that streaks in and lands in dust with ズザッ.</p>
  <div class="stage">
    <irina-button variant="secondary" id="open">Open Drawer</irina-button>
    <irina-drawer id="el" heading="Navigation">
      <p style="margin-top:0">Slide-over panel content goes here. Press Escape, click outside, or press ✕ to dismiss.</p>
    </irina-drawer>
  </div>
  <p class="hint">Press Open Drawer to slide the sheet in from the right.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="../button/button.js"></script>
<script src="drawer.js"></script>
<script>
const el = document.getElementById('el');
const say = (t) => { document.querySelector('.said').textContent = t; };
document.getElementById('open').addEventListener('click', () => { el.show(); say('open'); });
el.addEventListener('close', () => say('closed'));
</script>
</body>
</html>
